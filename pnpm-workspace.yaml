packages:
  - app/*
  - packages/*
  - tooling/*

# Shared development tools used by applications and packages.
catalog:
  '@eslint/js': '10.0.1'
  eslint: '10.12.0'
  prettier: '3.9.9'
  turbo: '2.11.7'
  typescript: '6.0.3'
  typescript-eslint: '8.71.0'
  vitest: '4.0.16'

# Platform dependencies are upgraded as separate compatible sets.
catalogs:
  mobile:
    '@react-native-async-storage/async-storage': '2.2.0'
    '@types/react': '~19.2.2'
    expo: '~57.0.26'
    expo-blur: '~57.0.3'
    expo-build-properties: '~57.0.22'
    expo-constants: '~57.0.20'
    expo-dev-client: '~57.0.19'
    expo-linking: '~57.0.11'
    expo-router: '~57.0.24'
    expo-status-bar: '~57.0.1'
    heroui-native: '1.0.10'
    react: '19.2.3'
    react-dom: '19.2.3'
    react-native: '0.86.3'
    react-native-gesture-handler: '~2.32.0'
    react-native-reanimated: '4.5.1'
    react-native-safe-area-context: '~5.7.0'
    react-native-screens: '~4.26.0'
    react-native-svg: '15.15.4'
    react-native-worklets: '0.10.1'
    tailwind-merge: '3.4.0'
    tailwind-variants: '3.2.2'
    tailwindcss: '4.3.3'
    uniwind: '1.12.1'
  weapp:
    '@babel/preset-react': '7.28.5'
    '@taroify/core': '1.0.6'
    '@tarojs/cli': '4.3.0'
    '@tarojs/components': '4.3.0'
    '@tarojs/helper': '4.3.0'
    '@tarojs/plugin-framework-react': '4.3.0'
    '@tarojs/plugin-platform-weapp': '4.3.0'
    '@tarojs/react': '4.3.0'
    '@tarojs/runtime': '4.3.0'
    '@tarojs/shared': '4.3.0'
    '@tarojs/taro': '4.3.0'
    '@tarojs/taro-loader': '4.3.0'
    '@tarojs/webpack5-runner': '4.3.0'
    '@types/react': '18.3.12'
    '@types/webpack-env': '1.18.8'
    babel-preset-taro: '4.3.0'
    react: '18.3.1'
    react-dom: '18.3.1'
    sass: '1.93.2'
    webpack: '5.91.0'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  '@tarojs/binding': false
  '@tarojs/cli': false
  core-js: false
  core-js-pure: false
  esbuild: true
